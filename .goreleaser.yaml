version: 2

project_name: sslcheck

before:
  hooks:
    - go mod tidy

builds:
  - id: sslcheck
    main: .
    binary: sslcheck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["6"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: sslcheck
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: sslcheck
    ids: [sslcheck]
    dockerfile: Dockerfile
    images:
      - ghcr.io/sollie/sslcheck
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v6
    labels:
      org.opencontainers.image.source: https://github.com/sollie/sslcheck
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  disable: true

release:
  # Release notes come from git-cliff (--release-notes in the workflow).
  mode: replace
